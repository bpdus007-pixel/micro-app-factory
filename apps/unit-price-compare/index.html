<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>단위가격 비교 계산기 — 100g당·100ml당 가격 비교</title>
  <meta name="description" content="용량과 가격이 다른 상품을 100g당·100ml당·1개당 가격으로 환산해 어느 쪽이 더 저렴한지 비교합니다. 묶음 상품도 계산합니다.">
  <link rel="stylesheet" href="../_shared/style.css">
</head>
<body>
  <main class="wrap">
    <header class="app-head">
      <h1>단위가격 비교 계산기</h1>
      <p>가격과 용량을 입력하면 같은 기준(100g·100ml·1개)으로 환산해 가장 저렴한 상품을 알려줍니다.</p>
    </header>

    <form class="card" id="form" novalidate>
      <div id="rows"></div>
      <div class="actions">
        <button type="submit" data-testid="compare">비교하기</button>
        <button type="button" class="secondary" id="add" data-testid="add">상품 추가</button>
        <button type="button" class="secondary" id="reset" data-testid="reset">초기화</button>
      </div>
      <p class="error" id="error" data-testid="error"></p>
    </form>

    <section class="card result" id="result" data-testid="result" aria-live="polite"></section>

    <section class="card">
      <h2 style="margin-top:0;font-size:1.1rem">사용 방법</h2>
      <p class="hint">무게(g·kg), 부피(ml·L), 개수 중 같은 종류의 단위끼리만 비교할 수 있습니다. 묶음 수량은 “500ml × 6입”처럼 같은 용량이 여러 개 들어 있을 때 입력합니다. 비어 있는 줄은 계산에서 제외됩니다.</p>
    </section>

    <footer class="app-foot">입력값은 이 브라우저 안에서만 계산되며 어디에도 전송되지 않습니다. · <a href="../../">다른 도구 보기</a></footer>
  </main>

  <template id="row-tpl">
    <fieldset class="card item" style="margin-bottom:12px">
      <legend class="item-legend" style="font-weight:700"></legend>
      <div class="row">
        <div><label>상품명 (선택)</label><input class="f-name" type="text" maxlength="40" autocomplete="off"></div>
        <div><label>가격 (원)</label><input class="f-price" type="text" inputmode="decimal" autocomplete="off"></div>
      </div>
      <div class="row">
        <div><label>용량</label><input class="f-amount" type="text" inputmode="decimal" autocomplete="off"></div>
        <div><label>단위</label>
          <select class="f-unit">
            <option value="g">g</option><option value="kg">kg</option>
            <option value="ml">ml</option><option value="L">L</option>
            <option value="ea">개</option>
          </select>
        </div>
        <div><label>묶음 수량</label><input class="f-pack" type="text" inputmode="numeric" placeholder="1" autocomplete="off"></div>
      </div>
    </fieldset>
  </template>

  <script type="module" src="./app.js"></script>
</body>
</html>
